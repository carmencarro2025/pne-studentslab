<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>SEQ2 server</title>
</head>
<body>
  <h1>SEQ2 server</h1>
  Access to the Server:
  <hr>

  <!-- FORM 1: PING -->
  <form action="ping" method="get">
    Is the server alive? <input type="submit" value="PING">
  </form>

  <hr>

  <!-- FORM 2: GET SEQUENCE -->
  <form action="get" method="get">
    Get a Sequence. Select sequence number
    <select name="n">
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <input type="submit" value="GET">
  </form>

  <hr>

  <!-- FORM 3: GENE -->
  <form action="gene" method="get">
    Get a Gene. Select the name
    <select name="gene">
      <option value="U5">U5</option>
      <option value="ADA">ADA</option>
      <option value="FRAT1">FRAT1</option>
      <option value="FXN">FXN</option>
      <option value="RNU6_269P">RNU6_269P</option>
    </select>
    <input type="submit" value="GENE">
  </form>

<hr>

 <!-- FORM 4: OPERATIONS -->
 <form action="operation" method="get"></form>
   Get a Gene. Select the name
   <select name="gene">
      <option value="U5">U5</option>
      <option value="ADA">ADA</option>
      <option value="FRAT1">FRAT1</option>
      <option value="FXN">FXN</option>
      <option value="RNU6_269P">RNU6_269P</option>
    </select>
    <input type="submit" value="GENE">
  </form>
</body>
</html>
